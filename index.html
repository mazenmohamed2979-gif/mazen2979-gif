<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الألعاب</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        header {
            background: #111;
            color: white;
            padding: 30px;
        }

        .content {
            padding: 40px 20px;
        }

        .game {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
        }

        button {
            background: #111;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>أهلاً وسهلاً 🎮</h1>
    </header>

    <div class="content">
        <div class="game">
            <h2>الألعاب</h2>
            <p>اختار اللعبة اللي تحب تلعبها</p>

            <button>ابدأ اللعب</button>
        </div>
    </div>

</body>
</html>
