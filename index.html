<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>موقع الألعاب البسيط الخاص بي</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            margin-top: 30px;
        }
        .game-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            width: 80%;
            max-width: 400px;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .rps-btn {
            font-size: 20px;
            padding: 8px 15px;
        }
    </style>
</head>
<body>

    <!-- اللعبة الأولى: تخمين الرقم -->
    <div class="game-box">
        <h2>🎮 لعبة تخمين الرقم</h2>
        <p>الكمبيوتر اختار رقم من 1 إلى 10، تقدر تخمنه؟</p>
        
        <input type="number" id="userGuess" min="1" max="10" placeholder="اكتب رقم هنا">
        <br>
        <button onclick="checkGuess()">تحقق من الإجابة</button>
        
        <p id="resultMessage" style="font-weight: bold; font-size: 16px;"></p>
    </div>

    <br>

    <!-- اللعبة الثانية: حجر النرد السريع -->
    <div class="game-box">
        <h2>🎲 لعبة حجر النرد</h2>
        <p>اضغط على الزر لتجرب حظك وترمي النرد!</p>
        
        <h1 id="diceResult" style="color: #28a745; margin: 10px;">🎲 ?</h1>
        
        <button onclick="rollDice()">ارمِ النرد</button>
        <button onclick="resetDice()" style="background-color: #6c757d;">إعادة ضبط</button>
    </div>

    <br>

    <!-- اللعبة الثالثة: حجرة ورقة مقص -->
    <div class="game-box">
        <h2>✂️ حجرة ورقة مقص</h2>
        <p>اختر سلاحك واهزم الكمبيوتر!</p>
        
        <button class="rps-btn" onclick="playRPS('حجرة')">✊ حجرة</button>
        <button class="rps-btn" onclick="playRPS('ورقة')">📄 ورقة</button>
        <button class="rps-btn" onclick="playRPS('مقص')">✂️ مقص</button>
        
        <p id="rpsResult" style="font-weight: bold; font-size: 16px; margin-top: 15px;"></p>
    </div>

    <br>

    <!-- اللعبة الرابعة: لعبة تجميع النقاط (العداد) -->
    <div class="game-box">
        <h2>🏆 لعبة تجميع النقاط</h2>
        <p>اضغط بأسرع ما يمكنك لجمع أكبر عدد من النقاط!</p>
        
        <h1 id="scoreDisplay" style="color: #ffc107; margin: 10px;">0</h1>
        
        <button onclick="incrementScore()" style="background-color: #28a745;">اضغط لتسجيل نقطة! 🎯</button>
        <button onclick="resetScore()" style="background-color: #dc3545;">تصفير النقاط</button>
    </div>

    <br>

    <!-- اللعبة الخامسة: لعبة صرة ولا كتابة (عملة معدنية) -->
    <div class="game-box">
        <h2>🪙 لعبة صرة ولا كتابة</h2>
        <p>ارمي العملة وجرب حظك!</p>
        
        <h1 id="coinResult" style="color: #17a2b8; margin: 10px;">🪙 ?</h1>
        
        <button onclick="flipCoin('صورة')">صورة</button>
        <button onclick="flipCoin('كتابة')">كتابة</button>
        
        <p id="coinMessage" style="font-weight: bold; font-size: 16px; margin-top: 15px;"></p>
    </div>

    <script>
        // كود اللعبة الأولى
        let secretNumber = Math.floor(Math.random() * 10) + 1;

        function checkGuess() {
            let guess = Number(document.getElementById('userGuess').value);
            let message = document.getElementById('resultMessage');

            if (guess === secretNumber) {
                message.style.color = "green";
                message.innerHTML = "🎉 برافو عليك! تخمينك صح 100%!";
            } else if (guess > secretNumber) {
                message.style.color = "orange";
                message.innerHTML = "📈 الرقم كبير جداً، جرب رقم أصغر.";
            } else if (guess < secretNumber) {
                message.style.color = "orange";
                message.innerHTML = "📉 الرقم صغير جداً، جرب رقم أكبر.";
            } else {
                message.style.color = "red";
                message.innerHTML = "❌ من فضلك اكتب رقم صحيح.";
            }
        }

        // كود اللعبة الثانية
        function rollDice() {
            let diceNumber = Math.floor(Math.random() * 6) + 1;
            document.getElementById('diceResult').innerHTML = "🎲 " + diceNumber;
        }

        function resetDice() {
            document.getElementById('diceResult').innerHTML = "🎲 ?";
        }

        // كود اللعبة الثالثة
        function playRPS(userChoice) {
            let choices = ['حجرة', 'ورقة', 'مقص'];
            let computerChoice = choices[Math.floor(Math.random() * 3)];
            let resultText = "";

            if (userChoice === computerChoice) {
                resultText = `🤝 تعادل! الكمبيوتر اختار (${computerChoice})`;
            } else if (
                (userChoice === 'حجرة' && computerChoice === 'مقص') ||
                (userChoice === 'ورقة' && computerChoice === 'حجرة') ||
                (userChoice === 'مقص' && computerChoice === 'ورقة')
            ) {
                resultText = `🎉 فزت! الكمبيوتر اختار (${computerChoice})`;
            } else {
                resultText = `😢 خسرت! الكمبيوتر اختار (${computerChoice})`;
            }

            document.getElementById('rpsResult').innerHTML = resultText;
        }

        // كود اللعبة الرابعة
        let score = 0;

        function incrementScore() {
            score++;
            document.getElementById('scoreDisplay').innerHTML = score;
        }

        function resetScore() {
            score = 0;
            document.getElementById('scoreDisplay').innerHTML = score;
        }

        // كود اللعبة الخامسة (صورة ولا كتابة)
        function flipCoin(userChoice) {
            let options = ['صورة', 'كتابة'];
            let coinFlip = options[Math.floor(Math.random() * 2)];
            let messageBox = document.getElementById('coinMessage');

            document.getElementById('coinResult').innerHTML = "🪙 " + coinFlip;

            if (userChoice === coinFlip) {
                messageBox.style.color = "green";
                messageBox.innerHTML = `🎉 مبروك! إجابتك صحيحة (طلعت ${coinFlip})`;
            } else {
                messageBox.style.color = "red";
                messageBox.innerHTML = `❌ حظ أوفر! طلعت (${coinFlip})`;
            }
        }
    </script>

</body>
</html>
